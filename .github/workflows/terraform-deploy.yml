name: Terraform Deploy

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.IAM_INFRA_ROLE_ID }}:role/flagging-infra-ci
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set Terraform Environment Directory
        id: set-env
        run: |
          if [[ "${GITHUB_REF##*/}" == "develop" ]]; then
            echo "env_dir=environments/development" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "env_dir=environments/staging" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "env_dir=environments/production" >> $GITHUB_OUTPUT
          else
            echo "No matching environment for branch ${GITHUB_REF##*/}"
            exit 1
          fi

      - name: Terraform Init
        run: terraform -chdir=${{ steps.set-env.outputs.env_dir }} init -backend-config=backend.hcl

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=${{ steps.set-env.outputs.env_dir }} plan -no-color -out=tfplan
        env:
          TF_VAR_admin_key: ${{ github.ref_name == 'develop' && secrets.ADMIN_KEY_DEV || github.ref_name == 'staging' && secrets.ADMIN_KEY_STAGING || github.ref_name == 'main' && secrets.ADMIN_KEY_PROD }}
          TF_VAR_redis_password: ${{ github.ref_name == 'develop' && secrets.REDIS_PASSWORD_DEV || github.ref_name == 'staging' && secrets.REDIS_PASSWORD_STAGING || github.ref_name == 'main' && secrets.REDIS_PASSWORD_PROD }}
          TF_VAR_sa_password: ${{ github.ref_name == 'develop' && secrets.SA_PASSWORD_DEV || github.ref_name == 'staging' && secrets.SA_PASSWORD_STAGING || github.ref_name == 'main' && secrets.SA_PASSWORD_PROD }}
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_api_cidrs: ${{ secrets.ALLOWED_API_CIDRS }}
          
      - name: Show Plan Summary
        run: terraform -chdir=${{ steps.set-env.outputs.env_dir }} show -no-color tfplan > ${{ steps.set-env.outputs.env_dir }}/plan.txt

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-tfplan
          path: ${{ steps.set-env.outputs.env_dir }}/plan.txt

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "Terraform Plan – ${{ steps.set-env.outputs.env_dir }}"
          path: ${{ steps.set-env.outputs.env_dir }}/plan.txt

      - name: Terraform Apply
        if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'main'
        run: terraform -chdir=${{ steps.set-env.outputs.env_dir }} apply -auto-approve
        env:
          TF_VAR_admin_key: ${{ github.ref_name == 'develop' && secrets.ADMIN_KEY_DEV || github.ref_name == 'staging' && secrets.ADMIN_KEY_STAGING || github.ref_name == 'main' && secrets.ADMIN_KEY_PROD }}
          TF_VAR_redis_password: ${{ github.ref_name == 'develop' && secrets.REDIS_PASSWORD_DEV || github.ref_name == 'staging' && secrets.REDIS_PASSWORD_STAGING || github.ref_name == 'main' && secrets.REDIS_PASSWORD_PROD }}
          TF_VAR_sa_password: ${{ github.ref_name == 'develop' && secrets.SA_PASSWORD_DEV || github.ref_name == 'staging' && secrets.SA_PASSWORD_STAGING || github.ref_name == 'main' && secrets.SA_PASSWORD_PROD }}
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_api_cidrs: ${{ secrets.ALLOWED_API_CIDRS }}
