name: Terraform Validation

on:
  pull_request:
    branches: [main, staging, develop]

  push:
    branches: [main, staging, develop]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-validation:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (development env)
        working-directory: environments/development
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: environments/development
        run: terraform validate

      - name: Terraform Lint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.52.0

      - name: Run TFLint recursively
        run: |
          find . -type f -name "*.tf" -exec dirname {} \; | sort -u | while read dir; do
            echo "Running TFLint in $dir"
            (cd "$dir" && tflint --init && tflint) || true
          done

      - name: Summary
        run: echo "Terraform syntax and lint checks completed successfully."

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validation
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.IAM_INFRA_ROLE_ID }}:role/flagging-infra-ci
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init (with backend)
        working-directory: environments/development
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        id: plan
        working-directory: environments/development
        run: terraform plan -no-color -out=tfplan
        env:
          TF_LOG: DEBUG

      - name: Save Plan Output
        run: terraform show -no-color tfplan > plan.txt
        working-directory: environments/development

      - name: Upload Plan as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/development/plan.txt

      - name: Comment Plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: environments/development/plan.txt
